<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Gateway trust boundaries</title><desc id="d">Boundaries around merchant identity, environment policy, browser actions, model credentials, and evidence</desc><rect width="1200" height="500" rx="24" fill="#0f172a"/>
<text x="60" y="62" fill="#fff" font-family="Arial" font-size="25" font-weight="700">Autonomy is bounded before the model acts</text><text x="60" y="92" fill="#94a3b8" font-family="Arial" font-size="15">The model proposes within a server-enforced envelope; it does not define its own permissions.</text>
<g font-family="Arial"><g><rect x="60" y="145" width="250" height="260" rx="20" fill="#111827" stroke="#22d3ee"/><text x="85" y="180" fill="#67e8f9" font-size="15" font-weight="700">IDENTITY + OWNERSHIP</text><text x="85" y="220" fill="#fff" font-size="17">Supabase session</text><text x="85" y="252" fill="#fff" font-size="17">Owner-scoped resources</text><text x="85" y="284" fill="#fff" font-size="17">Private / no-store APIs</text><text x="85" y="334" fill="#94a3b8" font-size="14">Another user's resource</text><text x="85" y="356" fill="#94a3b8" font-size="14">is not exposed.</text></g>
<g><rect x="340" y="145" width="250" height="260" rx="20" fill="#111827" stroke="#818cf8"/><text x="365" y="180" fill="#a5b4fc" font-size="15" font-weight="700">ENVIRONMENT POLICY</text><text x="365" y="220" fill="#fff" font-size="17">Exact authorized origin</text><text x="365" y="252" fill="#fff" font-size="17">Allowed path prefixes</text><text x="365" y="284" fill="#fff" font-size="17">Restricted query keys</text><text x="365" y="334" fill="#94a3b8" font-size="14">Unknown destinations and</text><text x="365" y="356" fill="#94a3b8" font-size="14">unsafe network targets block.</text></g>
<g><rect x="620" y="145" width="250" height="260" rx="20" fill="#111827" stroke="#c084fc"/><text x="645" y="180" fill="#d8b4fe" font-size="15" font-weight="700">ACTION ENVELOPE</text><text x="645" y="220" fill="#fff" font-size="17">Reviewed scenarios</text><text x="645" y="252" fill="#fff" font-size="17">Schema-validated actions</text><text x="645" y="284" fill="#fff" font-size="17">Observed-link navigation</text><text x="645" y="334" fill="#94a3b8" font-size="14">Default stopping point:</text><text x="645" y="356" fill="#94a3b8" font-size="14">recommend or decline.</text></g>
<g><rect x="900" y="145" width="240" height="260" rx="20" fill="#111827" stroke="#f472b6"/><text x="925" y="180" fill="#f9a8d4" font-size="15" font-weight="700">EVIDENCE + MODEL</text><text x="925" y="220" fill="#fff" font-size="17">Server-side API key</text><text x="925" y="252" fill="#fff" font-size="17">Independent evaluator</text><text x="925" y="284" fill="#fff" font-size="17">Replayable trace IDs</text><text x="925" y="334" fill="#94a3b8" font-size="14">Fixtures stay labeled and</text><text x="925" y="356" fill="#94a3b8" font-size="14">out of real pass rates.</text></g></g></svg>